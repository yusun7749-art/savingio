<style>
:root{--sv-navy:#132744;--sv-ink:#2d3033;--sv-gold:#b98238;--sv-line:rgba(19,39,68,.13)}*{box-sizing:border-box}body{margin:0;color:var(--sv-ink);background:#faf7f1}.site-header{position:sticky;top:0;z-index:500;border-bottom:1px solid var(--sv-line);background:rgba(251,247,239,.97);backdrop-filter:blur(14px)}.header-inner{width:min(1180px,calc(100% - 48px));min-height:80px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:28px}.logo{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:700;color:var(--sv-navy);text-decoration:none}.nav{display:flex;gap:24px}.nav a{color:var(--sv-navy);font-weight:750;text-decoration:none;white-space:nowrap}.nav a:hover,.nav a[aria-current="page"]{color:var(--sv-gold)}.info-shell{max-width:1120px;margin:auto;padding:38px 28px 80px}.page-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--sv-line)}.back-button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 0;color:var(--sv-navy);font:inherit;font-weight:800;cursor:pointer}.back-button:hover{color:var(--sv-gold)}.quick-links{display:flex;gap:16px}.quick-links a{font-size:13px;color:#696e73;text-decoration:none}.info-hero{padding:34px 0 20px}.info-hero h1{font-family:"Noto Serif KR",serif;font-size:clamp(38px,4.5vw,58px);line-height:1.3;letter-spacing:-2.4px;margin:0 0 12px;color:var(--sv-navy)}.info-hero p{font-size:16px;color:#5f646a;margin:0}.search-box{margin-top:16px}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:10px}.search-box input{width:100%;height:58px;padding:0 20px;border:1px solid var(--sv-line);border-radius:16px;background:#fff;font-size:15px}.search-row button{border:0;border-radius:16px;background:#132744;color:#fff;font-size:18px;cursor:pointer}.result-head{display:flex;justify-content:space-between;margin:28px 0 10px;color:#5e646b;font-size:13px}.result-head strong{color:var(--sv-navy);font-size:15px}.article-grid{display:grid;grid-template-columns:1fr;border-top:1px solid var(--sv-line)}.article-card{display:grid;grid-template-columns:150px minmax(0,1fr) auto;grid-template-areas:"category title link" "category desc link";align-items:center;column-gap:24px;padding:24px 4px;border-bottom:1px solid rgba(19,39,68,.10);text-decoration:none;color:var(--sv-ink)}.article-card .card-category{grid-area:category;color:var(--sv-gold);font-size:12px;font-weight:700}.article-card h2{grid-area:title;margin:0;font-size:19px;line-height:1.45;color:var(--sv-navy)}.article-card p{grid-area:desc;margin:7px 0 0;color:#70757b;font-size:13px;line-height:1.6}.article-card b{grid-area:link;color:var(--sv-navy);font-size:12px;white-space:nowrap}.pager{display:flex;justify-content:center;gap:8px;margin:28px 0}.pager button{min-width:40px;height:40px;border:1px solid #d5deeb;border-radius:10px;background:#fff}.pager button.active{background:var(--sv-navy);color:#fff}@media(max-width:760px){.header-inner{width:calc(100% - 28px);min-height:68px}.logo{font-size:27px}.nav{display:none}.info-shell{padding:22px 16px 58px}.page-tools{align-items:flex-start}.quick-links{display:none}.article-card{grid-template-columns:1fr auto;grid-template-areas:"category link" "title title" "desc desc";row-gap:7px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="logo" href="/">Savingio</a><nav class="nav" aria-label="주요 메뉴"><a href="/">홈</a><a href="/search.html" aria-current="page">생활정보</a><a href="/calculators/">계산기</a><a href="/lab/">Savingio Lab</a><a href="/categories/">사이트 탐색</a><a href="/about.html">About</a></nav></div></header>
<main class="info-shell">
<div class="page-tools"><button id="historyBack" class="back-button" type="button" aria-label="이전 페이지로 돌아가기">← 이전 페이지</button><div class="quick-links"><a href="/">홈으로</a><a href="/categories/">카테고리로 찾기</a><a href="/calculators/">계산기 보기</a></div></div>
<section class="info-hero"><h1>Savingio 전체 검색</h1><p>정확한 제목을 몰라도 비슷한 생활 표현으로 찾을 수 있습니다.</p></section>
<section class="search-box"><form id="standaloneSearch" class="search-row" role="search"><input id="articleSearch" name="q" type="search" placeholder="예: 누수, 관리비, 자동차보험, 과태료, 환급" autocomplete="off"><button type="submit" aria-label="검색">⌕</button></form></section>
<div class="result-head"><strong id="resultCount">정보를 불러오는 중입니다</strong><span>한 페이지에 12개씩 표시</span></div>
<section class="article-grid" id="articleGrid" aria-live="polite"></section><nav class="pager" aria-label="검색 결과 페이지"></nav>
</main>
<script src="/js/savingio-directory-search-v2.js?v=20260801-search-nav2"></script>
<script src="/js/savingio-search-lock.js?v=20260801-route-guard1"></script>
<script>
(function(){
 const f=document.getElementById('standaloneSearch'),i=document.getElementById('articleSearch'),back=document.getElementById('historyBack');
 if(f&&i)f.addEventListener('submit',function(e){e.preventDefault();var q=i.value.trim();var u=new URL(location.href);q?u.searchParams.set('q',q):u.searchParams.delete('q');history.replaceState(null,'',u.pathname+u.search);i.dispatchEvent(new Event('input',{bubbles:true}));});
 if(back)back.addEventListener('click',function(){if(history.length>1)history.back();else location.assign('/');});
})();
</script>
</body>
