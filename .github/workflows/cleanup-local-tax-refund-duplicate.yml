name: Cleanup local tax refund duplicate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-local-tax-refund-duplicate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add redirect and remove duplicate sitemap URL
        run: |
          python - <<'PY'
          from pathlib import Path

          redirects = Path('_redirects')
          text = redirects.read_text(encoding='utf-8')
          rule = '/articles/local-tax-refund-claim.html /articles/local-tax-refund-guide.html 301'
          if rule not in text.splitlines():
              if not text.endswith('\n'):
                  text += '\n'
              text += rule + '\n'
              redirects.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sitemap_text = sitemap.read_text(encoding='utf-8')
          retired = 'https://savingio.com/articles/local-tax-refund-claim.html'
          sitemap_text = sitemap_text.replace(f'  <url><loc>{retired}</loc></url>\n', '')
          sitemap.write_text(sitemap_text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- _redirects sitemap.xml; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'savingio-bot'
          git config user.email 'savingio-bot@users.noreply.github.com'
          git add _redirects sitemap.xml
          git commit -m 'Part019 redirect local tax refund duplicate and clean sitemap'
          git push
