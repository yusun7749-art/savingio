name: Production Playwright QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '운영 사이트 주소'
        required: false
        default: 'https://savingio.com'
  push:
    branches: [main]
    paths:
      - 'qa/playwright/**'
      - 'package.json'
      - '.github/workflows/playwright-production-qa.yml'
  schedule:
    - cron: '15 20 * * *'

permissions:
  contents: write

concurrency:
  group: savingio-production-playwright-qa
  cancel-in-progress: true

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser audit
        id: qa
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://savingio.com' }}
          MAX_PAGES: '220'
        run: npm run qa:site

      - name: Commit QA reports
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'savingio-playwright-bot'
          git config user.email 'savingio-playwright-bot@users.noreply.github.com'

          test -f factory/QA/playwright/SITE_RUNTIME_AUDIT.json && git add factory/QA/playwright/SITE_RUNTIME_AUDIT.json || true
          test -f factory/QA/playwright/SITE_RUNTIME_AUDIT.md && git add factory/QA/playwright/SITE_RUNTIME_AUDIT.md || true

          if git diff --cached --quiet; then
            echo 'No QA report changes'
            exit 0
          fi

          git commit -m 'Publish production Playwright QA report [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload browser QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savingio-production-qa
          path: factory/QA/playwright/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when QA found runtime problems
        if: steps.qa.outcome == 'failure'
        run: exit 1

