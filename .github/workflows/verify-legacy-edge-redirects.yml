name: Verify Legacy Edge Redirects

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/articles/irs-tax-refund-status.js'
      - 'functions/articles/small-business-policy-fund-search.js'
      - 'functions/articles/subsidy24-benefit-search.js'
      - '.github/workflows/verify-legacy-edge-redirects.yml'

permissions:
  contents: write

concurrency:
  group: savingio-legacy-edge-redirects
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for Cloudflare deployment
        run: sleep 90
      - name: Verify redirect responses
        id: verify
        continue-on-error: true
        run: |
          mkdir -p factory/QA/legacy-edge-redirects
          node <<'NODE'
          const fs = require('fs');
          const checks = [
            ['https://savingio.com/articles/irs-tax-refund-status.html', '/articles/hometax-refund-status.html'],
            ['https://savingio.com/articles/small-business-policy-fund-search.html', '/articles/small-business-policy-fund.html'],
            ['https://savingio.com/articles/subsidy24-benefit-search.html', '/articles/government24-benefit-check.html']
          ];
          (async () => {
            const rows = [];
            let failures = 0;
            for (const [url, expected] of checks) {
              try {
                const response = await fetch(url, { redirect: 'manual' });
                const location = response.headers.get('location') || '';
                const ok = response.status === 301 && location.includes(expected);
                rows.push(`${url} status=${response.status} location=${location} ok=${ok}`);
                if (!ok) failures++;
              } catch (error) {
                rows.push(`${url} error=${error.message} ok=false`);
                failures++;
              }
            }
            fs.writeFileSync('factory/QA/legacy-edge-redirects/RESULT.md', `# Legacy Edge Redirect Verification\n\n- generated: ${new Date().toISOString()}\n- failures: ${failures}\n- verdict: ${failures === 0 ? 'PASS' : 'FAIL'}\n\n${rows.map(row => '- ' + row).join('\n')}\n`);
            if (failures) process.exitCode = 1;
          })().catch(error => {
            fs.writeFileSync('factory/QA/legacy-edge-redirects/RESULT.md', `# Legacy Edge Redirect Verification\n\n- generated: ${new Date().toISOString()}\n- failures: 1\n- verdict: FAIL\n\n- runner error=${error.stack || error.message}\n`);
            process.exitCode = 1;
          });
          NODE
      - name: Commit report
        if: always()
        run: |
          git config user.name 'savingio-edge-qa-bot'
          git config user.email 'savingio-edge-qa-bot@users.noreply.github.com'
          git add factory/QA/legacy-edge-redirects/RESULT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish legacy edge redirect verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail when redirects are not active
        if: steps.verify.outcome == 'failure'
        run: exit 1
