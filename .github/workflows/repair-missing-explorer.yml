name: Repair missing article Explorer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory/repair_missing_explorer.py'
      - '.github/workflows/repair-missing-explorer.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject all missing Explorer assets
        run: python factory/repair_missing_explorer.py
      - name: Commit repaired pages and report
        run: |
          git config user.name "savingio-audit-bot"
          git config user.email "savingio-audit-bot@users.noreply.github.com"
          git add articles factory/QA/MISSING_EXPLORER_REPAIR.txt
          if git diff --cached --quiet; then
            echo "No missing Explorer assets"
            exit 0
          fi
          git commit -m "Repair all missing Explorer assets [skip ci]"
          git push
# full-repair-trigger: 2026-08-01
