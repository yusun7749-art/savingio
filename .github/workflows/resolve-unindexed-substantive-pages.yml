name: Resolve remaining unindexed article pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-unindexed-substantive-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate duplicates and register substantive guides
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          electric_old = [
              '/articles/#Uc804#Uae30#Uc694#Uae08-#Uc808#Uc57d-c861d77ba6.html',
              '/articles/전기요금-절약-c861d77ba6.html',
          ]
          electric_new = '/articles/electricity-bill-saving.html'
          old_long = '/articles/장기수선충당금-소유자-부담과-임차인-반환-확인-107af18f.html'
          new_long = '/articles/long-term-repair-reserve-refund-guide.html'

          # Rename the unique long-term repair reserve guide to a stable ASCII URL.
          old_long_path = Path(old_long.lstrip('/'))
          new_long_path = Path(new_long.lstrip('/'))
          if old_long_path.exists():
              text = old_long_path.read_text(encoding='utf-8')
              text = text.replace(old_long, new_long)
              text = text.replace('https://savingio.com' + old_long, 'https://savingio.com' + new_long)
              new_long_path.write_text(text, encoding='utf-8')
              old_long_path.unlink()

          # Delete low-value duplicated electricity pages.
          deleted = []
          for old in electric_old:
              p = Path(old.lstrip('/'))
              if p.exists():
                  p.unlink()
                  deleted.append(old)

          # Replace internal references across text assets.
          replacements = {**{old: electric_new for old in electric_old}, old_long: new_long}
          allowed = {'.html', '.js', '.json', '.xml', '.txt', '.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if '.git' in path.parts or '.github' in path.parts or path.name == '_redirects':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace('https://savingio.com' + old, 'https://savingio.com' + new)
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Add permanent redirects.
          redirects = Path('_redirects')
          rtext = redirects.read_text(encoding='utf-8')
          rules = [
              f'{electric_old[0]} {electric_new} 301',
              f'{electric_old[1]} {electric_new} 301',
              f'{old_long} {new_long} 301',
          ]
          for rule in rules:
              if rule not in rtext:
                  rtext = rtext.rstrip() + '\n' + rule + '\n'
          redirects.write_text(rtext, encoding='utf-8')

          # Ensure substantive pages are in sitemap and no old paths remain.
          sitemap = Path('sitemap.xml')
          stext = sitemap.read_text(encoding='utf-8')
          for old in electric_old + [old_long]:
              stext = re.sub(r'\s*<url><loc>https://savingio\.com' + re.escape(old) + r'</loc>.*?</url>', '', stext)
          required = [
              '/articles/car-insurance-saving.html',
              new_long,
          ]
          insert_at = stext.rfind('</urlset>')
          additions = ''
          for url in required:
              loc = f'https://savingio.com{url}'
              if loc not in stext:
                  additions += f'  <url><loc>{loc}</loc></url>\n'
          if additions:
              stext = stext[:insert_at] + additions + stext[insert_at:]
          sitemap.write_text(stext, encoding='utf-8')

          indexed = set(re.findall(r'<loc>https://savingio\.com(/articles/[^<]+\.html)</loc>', stext))
          article_files = [p for p in Path('articles').glob('*.html') if p.name != 'index.html']
          missing = sorted('/articles/' + p.name for p in article_files if '/articles/' + p.name not in indexed)
          report = {
              'report_date': '2026-07-27',
              'deleted_duplicate_pages': deleted,
              'renamed_unique_page': {'from': old_long, 'to': new_long},
              'registered_substantive_pages': required,
              'article_html_files_remaining': len(article_files),
              'sitemap_article_urls_remaining': len(indexed),
              'article_files_missing_from_sitemap': missing,
              'article_files_missing_from_sitemap_count': len(missing)
          }
          report_dir = Path('factory/REPORTS')
          report_dir.mkdir(parents=True, exist_ok=True)
          (report_dir / 'content-quality-consolidation-current.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate orphan duplicates and register substantive guides"
          git push
