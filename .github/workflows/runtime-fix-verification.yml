name: Runtime Fix Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-fix-verification.yml'
      - '_redirects'
      - 'sitemap.xml'
      - 'search.html'
      - 'benefits/**'
      - 'articles/earned-income-credit-status-check.html'
      - 'articles/gas-bill-checklist.html'
      - 'articles/vat-zero-sales-filing-2026.html'

permissions:
  contents: write

concurrency:
  group: savingio-runtime-fix-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify production fixes
        id: verify
        continue-on-error: true
        run: |
          mkdir -p factory/QA/runtime-fix
          node <<'NODE'
          const fs = require('fs');

          (async () => {
            const base = 'https://savingio.com';
            const checks = [
              ['/articles/irs-tax-refund-status.html', '/articles/hometax-refund-status.html'],
              ['/articles/small-business-policy-fund-search.html', '/articles/small-business-policy-fund.html'],
              ['/articles/subsidy24-benefit-search.html', '/articles/government24-benefit-check.html']
            ];
            const pages = [
              '/articles/earned-income-credit-status-check.html',
              '/articles/gas-bill-checklist.html',
              '/articles/vat-zero-sales-filing-2026.html',
              '/search.html',
              '/benefits/basic-livelihood.html',
              '/benefits/over-60.html'
            ];
            const rows = [];
            let failures = 0;

            for (const [from, expected] of checks) {
              try {
                const r = await fetch(base + from, { redirect: 'manual' });
                const location = r.headers.get('location') || '';
                const ok = [301, 302, 307, 308].includes(r.status) && location.includes(expected);
                rows.push(`redirect ${from} status=${r.status} location=${location} ok=${ok}`);
                if (!ok) failures++;
              } catch (error) {
                rows.push(`redirect ${from} error=${error.message} ok=false`);
                failures++;
              }
            }

            for (const path of pages) {
              try {
                const r = await fetch(base + path);
                const html = await r.text();
                const hasFooter = /<footer[\s>]/i.test(html);
                const badLegacy = /article-layout-dna\.js|savingio-brain-navigation-data\.js|savingio-article-unified-v3036\.js/i.test(html);
                const ok = r.status === 200 && hasFooter && !badLegacy;
                rows.push(`page ${path} status=${r.status} footer=${hasFooter} legacyJs=${badLegacy} ok=${ok}`);
                if (!ok) failures++;
              } catch (error) {
                rows.push(`page ${path} error=${error.message} ok=false`);
                failures++;
              }
            }

            try {
              const sitemapResponse = await fetch(base + '/sitemap.xml');
              const sitemap = await sitemapResponse.text();
              for (const [from] of checks) {
                const absent = !sitemap.includes(base + from);
                rows.push(`sitemap ${from} absent=${absent}`);
                if (!absent) failures++;
              }
            } catch (error) {
              rows.push(`sitemap error=${error.message}`);
              failures++;
            }

            fs.writeFileSync(
              'factory/QA/runtime-fix/RESULT.md',
              `# Runtime Fix Verification\n\n- generated: ${new Date().toISOString()}\n- failures: ${failures}\n- verdict: ${failures === 0 ? 'PASS' : 'FAIL'}\n\n${rows.map((x) => '- ' + x).join('\n')}\n`
            );

            if (failures) process.exitCode = 1;
          })().catch((error) => {
            fs.writeFileSync(
              'factory/QA/runtime-fix/RESULT.md',
              `# Runtime Fix Verification\n\n- generated: ${new Date().toISOString()}\n- failures: 1\n- verdict: FAIL\n\n- runner error=${error.stack || error.message}\n`
            );
            process.exitCode = 1;
          });
          NODE

      - name: Ensure report exists
        if: always()
        run: |
          mkdir -p factory/QA/runtime-fix
          if [ ! -f factory/QA/runtime-fix/RESULT.md ]; then
            printf '# Runtime Fix Verification\n\n- generated: %s\n- failures: 1\n- verdict: FAIL\n\n- runner stopped before producing a report\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > factory/QA/runtime-fix/RESULT.md
          fi

      - name: Commit verification report
        if: always()
        run: |
          git config user.name 'savingio-runtime-qa-bot'
          git config user.email 'savingio-runtime-qa-bot@users.noreply.github.com'
          git add factory/QA/runtime-fix/RESULT.md
          if git diff --cached --quiet; then
            echo 'No report changes'
            exit 0
          fi
          git commit -m 'Publish targeted runtime verification report [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when verification found problems
        if: steps.verify.outcome == 'failure'
        run: exit 1
