name: Cleanup internet duplicate URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-internet-duplicate-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired internet URL from sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sitemap.xml')
          text = path.read_text(encoding='utf-8')
          retired = 'https://savingio.com/articles/internet-bill-savings.html'
          text = text.replace(f'  <url><loc>{retired}</loc></url>\n', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit sitemap cleanup
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo 'No sitemap changes required.'
            exit 0
          fi
          git config user.name 'savingio-bot'
          git config user.email 'savingio-bot@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Part015 remove internet duplicate URL from sitemap'
          git push
