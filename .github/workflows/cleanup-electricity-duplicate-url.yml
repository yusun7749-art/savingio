name: Cleanup electricity duplicate URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-electricity-duplicate-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired electricity URL from sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sitemap.xml')
          text = path.read_text(encoding='utf-8')
          retired = [
              'https://savingio.com/articles/how-to-save-electricity-bill.html',
              'https://savingio.com/articles/reduce-electricity-bill.html',
          ]
          for url in retired:
              text = text.replace(f'  <url><loc>{url}</loc></url>\n', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit sitemap cleanup
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo 'No sitemap changes required.'
            exit 0
          fi
          git config user.name 'savingio-bot'
          git config user.email 'savingio-bot@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Part016 remove electricity duplicate URLs from sitemap'
          git push
