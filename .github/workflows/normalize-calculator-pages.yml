name: Normalize calculator pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory/normalize_calculator_pages.py'
      - '.github/workflows/normalize-calculator-pages.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize calculator pages to Calculator DNA
        run: python factory/normalize_calculator_pages.py
      - name: Commit normalized calculators and report
        run: |
          git config user.name 'savingio-calculator-bot'
          git config user.email 'savingio-calculator-bot@users.noreply.github.com'
          git add calculators factory/QA/CALCULATOR_DNA_NORMALIZATION.json
          if git diff --cached --quiet; then
            echo 'No calculator changes'
            exit 0
          fi
          git commit -m 'Normalize calculator pages to shared Calculator DNA [skip ci]'
          git push
