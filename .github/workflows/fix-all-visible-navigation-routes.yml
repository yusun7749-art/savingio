name: Fix all visible navigation routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-all-visible-navigation-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-all-visible-navigation-routes
  cancel-in-progress: true

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only visible global navigation destinations
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('articles/index.html'),
              Path('calculators/index.html'),
              Path('categories/index.html'),
              Path('js/savingio-platform-navigation.js'),
              Path('js/savingio-brain-navigation.js'),
          ]

          replacements = [
              ('href="/articles/"', 'href="/search.html"'),
              ('href="/articles/index.html"', 'href="/search.html"'),
              ('href="/categories/"', 'href="/categories/index.html"'),
              ("href:'/articles/'", "href:'/search.html'"),
              ("href:'/articles/index.html'", "href:'/search.html'"),
              ("href:'/categories/'", "href:'/categories/index.html'"),
              ("href:'/calculators/'", "href:'/calculators/index.html'"),
              ('href="/calculators/"', 'href="/calculators/index.html"'),
          ]

          changed = []
          for path in targets:
              if not path.exists():
                  raise SystemExit(f'missing required file: {path}')
              original = path.read_text(encoding='utf-8')
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          redirects = Path('_redirects')
          text = redirects.read_text(encoding='utf-8')
          bad = {
              '/categories/ /articles/ 301',
              '/categories/home /articles/ 301',
              '/categories/home.html /articles/ 301',
          }
          cleaned = '\n'.join(line for line in text.splitlines() if line.strip() not in bad) + '\n'
          if cleaned != text:
              redirects.write_text(cleaned, encoding='utf-8')
              changed.append('_redirects')

          print('changed:', ', '.join(changed) if changed else 'none')

      - name: Verify route sources
        shell: python
        run: |
          from pathlib import Path

          checks = {
              'index.html': ['/categories/index.html'],
              'articles/index.html': ['/search.html', '/categories/index.html', '/calculators/index.html'],
              'calculators/index.html': ['/search.html', '/categories/index.html'],
              'categories/index.html': ['/search.html', '/categories/index.html', '/calculators/index.html'],
              'js/savingio-platform-navigation.js': ['/search.html', '/categories/index.html', '/calculators/index.html'],
              'js/savingio-brain-navigation.js': ['/search.html', '/categories/index.html', '/calculators/index.html'],
          }
          failures=[]
          for name, expected in checks.items():
              text=Path(name).read_text(encoding='utf-8')
              for token in expected:
                  if token not in text:
                      failures.append(f'{name}: missing {token}')
          redirects=Path('_redirects').read_text(encoding='utf-8')
          if '/categories/ /articles/ 301' in redirects:
              failures.append('_redirects still redirects categories to articles')
          if failures:
              raise SystemExit('\n'.join(failures))

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'savingio-navigation-fix-bot'
          git config user.email 'savingio-navigation-fix-bot@users.noreply.github.com'
          git add index.html articles/index.html calculators/index.html categories/index.html js/savingio-platform-navigation.js js/savingio-brain-navigation.js _redirects
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Fix visible navigation routes across all entry pages'
          git pull --rebase origin main
          git push origin HEAD:main
