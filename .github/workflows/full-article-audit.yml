name: Full Article Audit

on:
  push:
    branches: [main]
    paths:
      - 'factory/full_article_audit.py'
      - 'factory/second_link_audit.py'
      - 'factory/unique_404_pattern_audit.py'
      - 'factory/remove_live_404_links.py'
      - 'factory/duplicate_content_review.py'
      - 'factory/content_quality_4200_audit.py'
      - '.github/workflows/full-article-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full article audit before cleanup
        run: python factory/full_article_audit.py
      - name: Run second-stage link audit before cleanup
        run: python factory/second_link_audit.py
      - name: Run unique 404 pattern audit before cleanup
        run: python factory/unique_404_pattern_audit.py

      - name: Remove verified live 404 links
        run: python factory/remove_live_404_links.py

      - name: Re-run full article audit after cleanup
        run: python factory/full_article_audit.py
      - name: Re-run second-stage link audit after cleanup
        run: python factory/second_link_audit.py
      - name: Re-run unique 404 pattern audit after cleanup
        run: python factory/unique_404_pattern_audit.py
      - name: Run duplicate content precision review
        run: python factory/duplicate_content_review.py
      - name: Run 4200 character content audit
        run: python factory/content_quality_4200_audit.py

      - name: Verify no live 404 references remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('factory/SECOND_LINK_AUDIT/second-link-audit.json')
          data = json.loads(report.read_text(encoding='utf-8'))
          count = int(data.get('summary', {}).get('actual_404_references', -1))
          print(f'actual_404_references={count}')
          if count != 0:
              raise SystemExit(f'Cleanup incomplete: {count} LIVE_404 references remain')
          PY

      - name: Commit cleaned articles and audit reports
        run: |
          if [ -z "$(git status --porcelain articles factory/FULL_ARTICLE_AUDIT factory/SECOND_LINK_AUDIT factory/UNIQUE_404_PATTERN_AUDIT factory/REMOVE_404_LINKS factory/DUPLICATE_CONTENT_REVIEW factory/CONTENT_4200_AUDIT)" ]; then
            echo 'No cleanup or report changes.'
            exit 0
          fi
          git config user.name 'savingio-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add articles
          git add -f factory/FULL_ARTICLE_AUDIT factory/SECOND_LINK_AUDIT factory/UNIQUE_404_PATTERN_AUDIT factory/REMOVE_404_LINKS factory/DUPLICATE_CONTENT_REVIEW factory/CONTENT_4200_AUDIT
          git commit -m 'Audit: classify duplicate content and apply 4200 review threshold [skip ci]'
          git push
