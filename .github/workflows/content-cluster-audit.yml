name: Run full content clustering audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build similarity clusters
        run: python factory/audit/content_cluster_audit.py
      - name: Verify reports
        run: |
          test -s factory/reports/content-cluster-audit.json
          test -s factory/reports/content-cluster-audit.md
      - name: Commit reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory/reports/content-cluster-audit.json factory/reports/content-cluster-audit.md
          git diff --cached --quiet || git commit -m 'Generate full content similarity clusters'
          git push
