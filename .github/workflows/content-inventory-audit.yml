name: Content Inventory Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "factory/audit/content_inventory_audit.py"
      - ".github/workflows/content-inventory-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run inventory audit
        run: python factory/audit/content_inventory_audit.py

      - name: Commit verified audit report
        run: |
          git config user.name "savingio-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add factory/MASTER_LOG/06_QA/CONTENT_INVENTORY_AUDIT.json
          git add factory/MASTER_LOG/06_QA/CONTENT_INVENTORY_AUDIT.md
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "V3.042 record verified content inventory audit"
            git push
          fi
