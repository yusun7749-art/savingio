name: Consolidate traffic fines cluster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-traffic-fines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deduplicate sitemap and recount content
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          representative = 'https://savingio.com/articles/traffic-fines-difference-guide.html'
          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')

          blocks = re.findall(r'\s*<url>.*?</url>', text, flags=re.S)
          seen = set()
          kept = []
          for block in blocks:
              match = re.search(r'<loc>(.*?)</loc>', block)
              if not match:
                  continue
              loc = match.group(1)
              if loc in seen:
                  continue
              seen.add(loc)
              kept.append('  ' + block.strip())

          rebuilt = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          rebuilt += '\n'.join(kept)
          rebuilt += '\n</urlset>\n'
          sitemap.write_text(rebuilt, encoding='utf-8')

          article_files = sorted(p for p in Path('articles').glob('*.html') if p.name != 'index.html')
          sitemap_article_urls = sorted({u for u in re.findall(r'<loc>(https://savingio\.com/articles/[^<]+\.html)</loc>', rebuilt)})
          report_dir = Path('factory/REPORTS')
          report_dir.mkdir(parents=True, exist_ok=True)
          report = {
              'report_date': '2026-07-27',
              'article_html_files_remaining': len(article_files),
              'sitemap_article_urls_remaining': len(sitemap_article_urls),
              'article_files_missing_from_sitemap': len(set('https://savingio.com/articles/' + p.name for p in article_files) - set(sitemap_article_urls)),
              'cluster_before': 3,
              'cluster_after': 1,
              'deleted_in_this_task': 2,
              'representative_url': '/articles/traffic-fines-difference-guide.html',
              'representative_sitemap_occurrences': rebuilt.count('<loc>' + representative + '</loc>'),
              'deleted_urls': [
                  '/articles/traffic-fine-check-payment-guide.html',
                  '/articles/traffic-penalty-check-payment-guide.html'
              ]
          }
          (report_dir / 'content-count-current.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml factory/REPORTS/content-count-current.json
          git diff --cached --quiet && exit 0
          git commit -m "Deduplicate sitemap and recount Savingio articles"
          git push
