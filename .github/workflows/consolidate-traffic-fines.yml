name: Consolidate traffic fines cluster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-traffic-fines.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update references sitemap and count
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          old_urls = [
              '/articles/traffic-fine-check-payment-guide.html',
              '/articles/traffic-penalty-check-payment-guide.html',
          ]
          new_url = '/articles/traffic-fines-difference-guide.html'
          allowed = {'.html', '.js', '.json', '.xml', '.txt', '.md'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if '.git' in path.parts or '.github' in path.parts or path.name == '_redirects':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = text
              for old in old_urls:
                  text = text.replace('https://savingio.com' + old, 'https://savingio.com' + new_url)
                  text = text.replace(old, new_url)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          sitemap = Path('sitemap.xml')
          stext = sitemap.read_text(encoding='utf-8')
          for old in old_urls:
              stext = re.sub(r'\s*<url><loc>https://savingio\.com' + re.escape(old) + r'</loc>.*?</url>', '', stext)
          sitemap.write_text(stext, encoding='utf-8')
          article_files = sorted(p for p in Path('articles').glob('*.html') if p.name != 'index.html')
          sitemap_article_urls = re.findall(r'<loc>https://savingio\.com/articles/[^<]+\.html</loc>', stext)
          report_dir = Path('factory/REPORTS')
          report_dir.mkdir(parents=True, exist_ok=True)
          report = {
              'report_date': '2026-07-27',
              'article_html_files_remaining': len(article_files),
              'sitemap_article_urls_remaining': len(sitemap_article_urls),
              'cluster_before': 3,
              'cluster_after': 1,
              'deleted_in_this_task': 2,
              'representative_url': new_url,
              'deleted_urls': old_urls
          }
          (report_dir / 'content-count-current.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh traffic fines references and content count"
          git push
