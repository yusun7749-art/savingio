name: Full AdSense structure audit
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'topics/**'
      - 'calculators/**'
      - 'categories/**'
      - 'data/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'search.html'
      - 'factory/audit_blue_ui_and_missing_pages.py'
      - '.github/workflows/audit-blue-ui-and-404.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair right rail parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('factory/audit_blue_ui_and_missing_pages.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def rail_section(text: str) -> str:')
          end = text.index('\n\ndef scan_rail', start)
          replacement = '''def rail_section(text: str) -> str:
              # Keep opening and closing tags paired. The old mixed-tag pattern
              # stopped an aside at the first nested div and produced false errors.
              aside = re.search(r"<aside[^>]+class=[\\\"'][^\\\"']*(?:right-rail|right\\b|sidebar)[^\\\"']*[\\\"'][^>]*>(.*?)</aside>", text, re.I | re.S)
              if aside:
                  return aside.group(1)
              div = re.search(r"<div[^>]+class=[\\\"'][^\\\"']*(?:right-rail|right\\b|sidebar)[^\\\"']*[\\\"'][^>]*>(.*?)</div>", text, re.I | re.S)
              return div.group(1) if div else ""
          '''
          path.write_text(text[:start] + replacement.rstrip() + text[end:], encoding='utf-8')
          PY
      - name: Run full audit and capture status
        id: audit
        shell: bash
        run: |
          set +e
          python factory/audit_blue_ui_and_missing_pages.py > /tmp/full-audit-output.txt 2>&1
          code=$?
          mkdir -p factory/QA
          {
            echo "exit_code=$code"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- output ---"
            cat /tmp/full-audit-output.txt
          } > factory/QA/FULL_AUDIT_RUN_STATUS.txt
          exit 0
      - name: Commit reports and diagnostics
        shell: bash
        run: |
          git config user.name 'savingio-audit-bot'
          git config user.email 'savingio-audit-bot@users.noreply.github.com'
          git add factory/audit_blue_ui_and_missing_pages.py
          git add factory/QA/FULL_AUDIT_RUN_STATUS.txt
          test -f factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.json && git add factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.json
          test -f factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.md && git add factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No audit output changes'
            exit 0
          fi
          git commit -m 'Fix right rail audit parser and publish refreshed results [skip ci]'
          git push
# audit-trigger: 2026-08-01T15:40+09:00
