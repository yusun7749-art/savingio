name: Audit blue UI and missing article links
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'data/**'
      - 'js/**'
      - 'factory/audit_blue_ui_and_missing_pages.py'
      - '.github/workflows/audit-blue-ui-and-404.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit
        run: python factory/audit_blue_ui_and_missing_pages.py
      - name: Commit reports
        run: |
          if git diff --quiet -- factory/QA/BLUE_UI_AND_404_AUDIT.json factory/QA/BLUE_UI_AND_404_AUDIT.md; then
            echo 'No report changes'
            exit 0
          fi
          git config user.name 'savingio-audit-bot'
          git config user.email 'savingio-audit-bot@users.noreply.github.com'
          git add factory/QA/BLUE_UI_AND_404_AUDIT.json factory/QA/BLUE_UI_AND_404_AUDIT.md
          git commit -m 'Audit blue UI templates and missing article links [skip ci]'
          git push
