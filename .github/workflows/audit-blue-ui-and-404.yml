name: Full AdSense structure audit
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'topics/**'
      - 'calculators/**'
      - 'categories/**'
      - 'data/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'search.html'
      - 'factory/audit_blue_ui_and_missing_pages.py'
      - '.github/workflows/audit-blue-ui-and-404.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full audit
        run: python factory/audit_blue_ui_and_missing_pages.py
      - name: Commit reports
        run: |
          if git diff --quiet -- factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.json factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.md; then
            echo 'No report changes'
            exit 0
          fi
          git config user.name 'savingio-audit-bot'
          git config user.email 'savingio-audit-bot@users.noreply.github.com'
          git add factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.json factory/QA/FULL_ADSENSE_STRUCTURE_AUDIT.md
          git commit -m 'Audit all Savingio pages for AdSense structure [skip ci]'
          git push
# audit-trigger: 2026-08-01T07:00+09:00
