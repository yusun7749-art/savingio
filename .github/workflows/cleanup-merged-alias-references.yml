name: Cleanup Merged Alias References

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-alias-references.yml'

permissions:
  contents: write

concurrency:
  group: savingio-cleanup-merged-alias-references
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace deleted article aliases in active navigation and search data
        run: |
          python - <<'PY'
          from pathlib import Path

          mappings = {
              '/articles/irs-tax-refund-status.html': '/articles/hometax-refund-status.html',
              '/articles/irs-tax-refund-status': '/articles/hometax-refund-status',
              '/articles/small-business-policy-fund-search.html': '/articles/small-business-policy-fund.html',
              '/articles/small-business-policy-fund-search': '/articles/small-business-policy-fund',
              '/articles/subsidy24-benefit-search.html': '/articles/government24-benefit-check.html',
              '/articles/subsidy24-benefit-search': '/articles/government24-benefit-check',
          }

          targets = [
              Path('data/savingio-brain-data.json'),
              Path('data/savingio-search-index.json'),
              Path('data/savingio-navigation-exclusions.json'),
              Path('data/savingio-brain-data.js'),
              Path('js/savingio-article-registry.js'),
          ]

          changed = []
          for path in targets:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8', errors='ignore')
              updated = original
              for old, new in mappings.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          report = Path('factory/QA/MERGED_ALIAS_ACTIVE_REFERENCE_CLEANUP.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(
              '# Merged Alias Active Reference Cleanup\n\n'
              + ('- changed: ' + ', '.join(changed) if changed else '- changed: none')
              + '\n- aliases: irs-tax-refund-status, small-business-policy-fund-search, subsidy24-benefit-search\n',
              encoding='utf-8'
          )
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'savingio-alias-cleanup-bot'
          git config user.email 'savingio-alias-cleanup-bot@users.noreply.github.com'
          git add data/savingio-brain-data.json data/savingio-search-index.json data/savingio-navigation-exclusions.json data/savingio-brain-data.js js/savingio-article-registry.js factory/QA/MERGED_ALIAS_ACTIVE_REFERENCE_CLEANUP.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No active alias references required changes'
            exit 0
          fi
          git commit -m 'Remove merged alias references from active data'
          git pull --rebase origin main
          git push origin HEAD:main
