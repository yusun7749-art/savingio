name: Actions Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        run: |
          mkdir -p factory/QA
          printf 'actions_ok=true\ncommit=%s\ngenerated_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > factory/QA/ACTIONS_SMOKE_TEST.txt
      - name: Commit marker
        run: |
          git config user.name 'savingio-actions-bot'
          git config user.email 'savingio-actions-bot@users.noreply.github.com'
          git add factory/QA/ACTIONS_SMOKE_TEST.txt
          git commit -m 'Publish Actions smoke test [skip ci]' || exit 0
          git push
