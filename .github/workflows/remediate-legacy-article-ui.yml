name: Remediate legacy article UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory/remediate_legacy_article_ui.py'
      - 'factory/QA/UI_REMEDIATION_QUEUE.json'
      - '.github/workflows/remediate-legacy-article-ui.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply non-card Savingio UI to legacy pages
        run: python factory/remediate_legacy_article_ui.py
      - name: Commit remediated pages
        run: |
          git config user.name 'savingio-audit-bot'
          git config user.email 'savingio-audit-bot@users.noreply.github.com'
          git add articles factory/QA/UI_REMEDIATION_APPLIED.md
          if git diff --cached --quiet; then
            echo 'No legacy UI pages changed'
            exit 0
          fi
          git commit -m 'Replace legacy blue and card article UI [skip ci]'
          git push
