name: Cleanup property tax electronic notice duplicate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-property-tax-electronic-notice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean references sitemap and refresh counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          old_url = '/articles/property-tax-electronic-notice-2026.html'
          new_url = '/articles/property-tax-electronic-bill-2026.html'
          allowed = {'.html', '.js', '.json', '.xml', '.txt', '.md'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if '.git' in path.parts or '.github' in path.parts or path.name == '_redirects':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = text
              text = text.replace('https://savingio.com' + old_url, 'https://savingio.com' + new_url)
              text = text.replace(old_url, new_url)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          stext = sitemap.read_text(encoding='utf-8')
          stext = re.sub(r'\s*<url><loc>https://savingio\.com' + re.escape(old_url) + r'</loc>.*?</url>', '', stext)
          # Deduplicate exact URL entries while preserving order.
          seen = set()
          def keep(match):
              loc = match.group(1)
              if loc in seen:
                  return ''
              seen.add(loc)
              return match.group(0)
          stext = re.sub(r'\s*(<url><loc>(https://savingio\.com/[^<]+)</loc>.*?</url>)', lambda m: keep(type('M', (), {'group': lambda self, n: m.group(2) if n == 1 else m.group(0)})()), stext)
          sitemap.write_text(stext, encoding='utf-8')

          article_files = sorted(p for p in Path('articles').glob('*.html') if p.name != 'index.html')
          sitemap_urls = re.findall(r'<loc>https://savingio\.com/articles/[^<]+\.html</loc>', stext)
          unique_sitemap_urls = sorted(set(sitemap_urls))
          report_dir = Path('factory/REPORTS')
          report_dir.mkdir(parents=True, exist_ok=True)
          report = {
              'report_date': '2026-07-27',
              'article_html_files_remaining': len(article_files),
              'sitemap_article_urls_remaining': len(unique_sitemap_urls),
              'deleted_in_this_task': 1,
              'representative_url': new_url,
              'deleted_urls': [old_url]
          }
          (report_dir / 'content-count-current.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean property tax electronic notice duplicate references"
          git push
