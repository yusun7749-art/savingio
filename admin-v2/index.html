<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Savingio Admin V2</title>
  <link rel="stylesheet" href="/admin-v2/admin-v2.css?v=3">
</head>
<body>
  <div class="admin-shell" id="adminShell" data-shell-lock="admin-v2">
    <aside class="admin-sidebar" id="adminExplorer" data-shell-region="explorer" aria-label="Savingio Admin Explorer">
      <div class="admin-brand"><strong>Savingio</strong><span>ADMIN V2</span></div>
      <nav class="admin-nav" id="adminNav" aria-label="관리 메뉴">
        <section class="nav-group open">
          <button class="nav-group-title active" type="button" data-view="command-home" aria-expanded="true"><span>⌂ 통합 상황실</span><span>⌄</span></button>
          <div class="nav-children">
            <button type="button" data-view="command-progress">전체 진행률</button>
            <button type="button" data-view="tool-build-progress">개발 진행 보드</button>
            <button type="button" data-view="tool-runtime-audit">런타임 검증 센터</button>
            <button type="button" data-view="command-today">오늘 작업</button>
            <button type="button" data-view="command-approval">승인 센터</button>
            <button type="button" data-view="command-error">오류·중지</button>
            <button type="button" data-view="command-revenue">수익 요약</button>
          </div>
        </section>
        <section class="nav-group open">
          <button class="nav-group-title" type="button" data-view="dept-cms" aria-expanded="true"><span>▦ 운영 부서</span><span>⌄</span></button>
          <div class="nav-children">
            <button type="button" data-view="dept-content">콘텐츠</button>
            <button type="button" data-view="dept-seo">SEO</button>
            <button type="button" data-view="dept-image">이미지</button>
            <button type="button" data-view="dept-qa">QA</button>
            <button type="button" data-view="dept-deploy">배포 센터</button>
            <button type="button" data-view="dept-analytics">분석 센터</button>
            <button type="button" data-view="dept-revenue">수익 센터</button>
          </div>
        </section>
        <section class="nav-group open">
          <button class="nav-group-title" type="button" data-view="tool-seo-doctor" aria-expanded="true"><span>✚ 진단 도구</span><span>⌄</span></button>
          <div class="nav-children">
            <button type="button" data-view="tool-seo-doctor">SEO Doctor</button>
            <button type="button" data-view="tool-content-doctor">Content Doctor</button>
          </div>
        </section>
        <section class="nav-group open">
          <button class="nav-group-title" type="button" data-view="tool-search-console" aria-expanded="true"><span>⌕ 외부 점검</span><span>⌄</span></button>
          <div class="nav-children">
            <button type="button" data-view="tool-search-console">Search Console 센터</button>
            <button type="button" data-view="tool-adsense">AdSense 센터</button>
            <button type="button" data-view="tool-github-release">GitHub Release 센터</button>
            <button type="button" data-view="tool-cloudflare">Cloudflare 센터</button>
          </div>
        </section>
      </nav>
      <div class="admin-system"><span></span><div><strong>Shell LOCK</strong><small id="shellStatus">검증 중</small></div></div>
    </aside>
    <main class="admin-main" data-shell-region="main">
      <header class="admin-header" id="adminHeader" data-shell-region="header">
        <div><p>비공개 운영본부</p><h1 id="pageTitle">통합 상황실</h1></div>
        <div class="header-actions"><a href="/admin/" class="button secondary">기존 Admin</a><button class="button secondary" id="diagnosticsBtn" type="button">구조 검사</button><button class="button" id="refreshBtn" type="button">새로고침</button></div>
      </header>
      <section id="adminWorkspace" class="admin-workspace" data-shell-region="workspace" aria-live="polite"></section>
    </main>
  </div>
  <script src="/admin-v2/core/project-store.js?v=2"></script>
  <script src="/admin-v2/core/department-store.js?v=1"></script>
  <script src="/admin-v2/core/workflow-engine.js?v=6"></script>
  <script src="/admin-v2/core/pipeline-engine.js?v=1"></script>
  <script src="/admin-v2/core/search-console-store.js?v=1"></script>
  <script src="/admin-v2/core/adsense-config.js?v=1"></script>
  <script src="/admin-v2/core/adsense-store.js?v=1"></script>
  <script src="/admin-v2/core/github-release-store.js?v=1"></script>
  <script src="/admin-v2/core/center-renderer.js?v=1"></script>
  <script src="/admin-v2/core/center-store-factory.js?v=1"></script>
  <script src="/admin-v2/core/build-progress-store.js?v=3"></script>
  <script src="/admin-v2/core/cloudflare-store.js?v=1"></script>
  <script src="/admin-v2/core/task-queue.js?v=1"></script>
  <script src="/admin-v2/core/module-registry.js?v=2"></script>
  <script src="/admin-v2/modules/command.js?v=5"></script>
  <script src="/admin-v2/modules/cms.js?v=2"></script>
  <script src="/admin-v2/modules/content.js?v=3"></script>
  <script src="/admin-v2/modules/seo.js?v=3"></script>
  <script src="/admin-v2/modules/image.js?v=3"></script>
  <script src="/admin-v2/modules/qa.js?v=2"></script>
  <script src="/admin-v2/modules/deploy.js?v=3"></script>
  <script src="/admin-v2/modules/analytics.js?v=3"></script>
  <script src="/admin-v2/modules/revenue.js?v=3"></script>
  <script src="/admin-v2/modules/search-console.js?v=1"></script>
  <script src="/admin-v2/modules/adsense.js?v=1"></script>
  <script src="/admin-v2/modules/github-release.js?v=1"></script>
  <script src="/admin-v2/modules/build-progress.js?v=1"></script>
  <script src="/admin-v2/modules/cloudflare.js?v=1"></script>
  <script src="/admin-v2/modules/seo-doctor.js?v=1"></script>
  <script src="/admin-v2/modules/content-doctor.js?v=1"></script>
  <script src="/admin-v2/modules/runtime-audit.js?v=2"></script>
  <script src="/admin-v2/app.js?v=11"></script>
  <script src="/admin-v2/center-refresh.js?v=1"></script>
</body>
</html>
