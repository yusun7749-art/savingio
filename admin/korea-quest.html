<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<title>Korea Quest Private Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef2f7;color:#17212b}.wrap{width:min(1050px,100%);margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#e84545,#3157c8);display:grid;place-items:center;font-size:26px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:#66717d;font-size:13px}.badge{background:#17212b;color:#fff;padding:8px 11px;border-radius:999px;font-size:11px}.card{background:#fff;border:1px solid #dce2e9;border-radius:22px;padding:22px;box-shadow:0 16px 40px rgba(20,35,55,.08)}.language{text-align:center;padding:38px 12px}.language h2{font-size:clamp(28px,5vw,46px);margin:8px 0}.language p{color:#66717d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:620px;margin:25px auto 0}.lang{border:1px solid #dce2e9;background:#fff;border-radius:16px;padding:17px;text-align:left;font-size:16px;cursor:pointer}.lang:hover{border-color:#3157c8}.flag{font-size:25px;margin-right:10px}.game{display:none}.hud{display:flex;align-items:center;gap:12px;margin-bottom:15px}.bar{height:10px;background:#e5e9ee;border-radius:999px;overflow:hidden;flex:1}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#3157c8,#e84545)}.xp{background:#fff;border:1px solid #dce2e9;border-radius:12px;padding:9px 12px}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.scene{min-height:430px;border-radius:20px;padding:25px;background:linear-gradient(145deg,#dcecff,#fff3d8)}.scene.restaurant{background:linear-gradient(145deg,#ffe0cd,#fff4d8)}.icon{font-size:72px;margin:20px 0}.scene h2{font-size:38px;margin:0 0 10px}.intro{color:#45515d}.speech{background:#fff;border-radius:17px;padding:18px;margin-top:28px}.ko{font-size:25px;font-weight:800}.roman{color:#3157c8;margin-top:5px}.meaning{color:#66717d;margin-top:8px}.side{display:flex;flex-direction:column;gap:10px}.mission,.feedback{background:#fff;border:1px solid #dce2e9;border-radius:16px;padding:15px}.mission h3{margin:0 0 8px}.mission p{margin:0;color:#66717d}.answers{display:grid;gap:9px}.answer{border:1px solid #dce2e9;border-radius:14px;background:#fff;padding:13px;text-align:left;cursor:pointer}.answer:hover{border-color:#3157c8}.answer.ok{background:#ecf9f1;border-color:#198754}.answer.no{background:#fff0f0;border-color:#d83b3b}.feedback{min-height:72px}.next{display:none;border:0;border-radius:14px;padding:14px;background:#17212b;color:#fff;font-weight:700;cursor:pointer}.tools{display:flex;justify-content:space-between;margin-top:15px}.ghost{border:1px solid #dce2e9;border-radius:12px;background:#fff;padding:10px 13px;cursor:pointer}.done{display:none;text-align:center;padding:45px 10px}.done .trophy{font-size:74px}.done h2{font-size:36px}.phrases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.phrase{border:1px solid #dce2e9;border-radius:14px;padding:14px}.phrase strong{display:block}.phrase small{color:#66717d}@media(max-width:760px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.grid,.phrases{grid-template-columns:1fr}.scene{min-height:360px}.scene h2{font-size:30px}.ko{font-size:21px}.badge{display:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><div class="brand"><div class="logo">🇰🇷</div><div><h1>Korea Quest</h1><p>Savingio Private Experience Lab</p></div></div><span class="badge">HIDDEN · NOINDEX</span></header>
<section class="card language" id="language"><div style="font-size:60px">🧳</div><h2>언어를 선택하세요</h2><p>영어를 몰라도 모국어로 한국 생활을 연습할 수 있습니다.</p><div class="grid" id="languageGrid"></div></section>
<section class="game" id="game"><div class="hud"><div class="bar"><span id="bar"></span></div><div class="xp">⭐ <b id="xp">0</b> XP</div></div><div class="card"><div class="layout"><section class="scene" id="scene"><div id="label"></div><div class="icon" id="icon"></div><h2 id="title"></h2><p class="intro" id="intro"></p><div class="speech"><div class="ko" id="ko"></div><div class="roman" id="roman"></div><div class="meaning" id="meaning"></div></div></section><aside class="side"><div class="mission"><h3 id="missionTitle"></h3><p id="mission"></p></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next"></button></aside></div><div class="tools"><button class="ghost" id="restart">↺</button><button class="ghost" id="change">🌍</button></div></div></section>
<section class="card done" id="done"><div class="trophy">🏆</div><h2 id="doneTitle"></h2><p id="doneText"></p><div class="phrases" id="phrases"></div><button class="ghost" id="again"></button></section>
</main>
<script>
const L={en:{flag:'🇺🇸',name:'English',mission:'Your mission',pick:'Choose your answer',ok:'Great! That sounds natural.',no:'Try again.',next:'Next mission',restart:'Restart',change:'Language',done:'Day 1 complete!',doneText:'You used Korean on the subway and at a restaurant.',again:'Play again'},th:{flag:'🇹🇭',name:'ภาษาไทย',mission:'ภารกิจของคุณ',pick:'เลือกคำตอบ',ok:'เยี่ยมมาก! ฟังดูเป็นธรรมชาติ',no:'ลองอีกครั้ง',next:'ภารกิจต่อไป',restart:'เริ่มใหม่',change:'ภาษา',done:'วันที่ 1 สำเร็จ!',doneText:'คุณใช้ภาษาเกาหลีบนรถไฟใต้ดินและในร้านอาหารได้แล้ว',again:'เล่นอีกครั้ง'},id:{flag:'🇮🇩',name:'Bahasa Indonesia',mission:'Misi kamu',pick:'Pilih jawaban',ok:'Bagus! Kedengarannya alami.',no:'Coba lagi.',next:'Misi berikutnya',restart:'Mulai lagi',change:'Bahasa',done:'Hari pertama selesai!',doneText:'Kamu berhasil memakai bahasa Korea di subway dan restoran.',again:'Main lagi'},vi:{flag:'🇻🇳',name:'Tiếng Việt',mission:'Nhiệm vụ',pick:'Chọn câu trả lời',ok:'Tuyệt! Câu đó rất tự nhiên.',no:'Hãy thử lại.',next:'Nhiệm vụ tiếp theo',restart:'Chơi lại',change:'Ngôn ngữ',done:'Hoàn thành ngày 1!',doneText:'Bạn đã dùng tiếng Hàn trên tàu điện ngầm và tại nhà hàng.',again:'Chơi lại'}};
const S=[{key:'subway',icon:'🚇',title:{en:'Take the subway',th:'ขึ้นรถไฟใต้ดิน',id:'Naik subway',vi:'Đi tàu điện ngầm'},intro:{en:'You are at Seoul Station and need to reach Hongdae.',th:'คุณอยู่สถานีโซลและต้องไปฮงแด',id:'Kamu berada di Seoul Station dan ingin pergi ke Hongdae.',vi:'Bạn đang ở ga Seoul và cần đến Hongdae.'},ko:'홍대입구역에 가려면 어떻게 가요?',roman:'Hongdae-ipgu-yeoge garyeomyeon eotteoke gayo?',meaning:{en:'How do I get to Hongik University Station?',th:'ไปสถานีฮงแดอิปกูอย่างไรคะ/ครับ',id:'Bagaimana cara pergi ke Stasiun Hongik University?',vi:'Đi đến ga Hongik University như thế nào?'},mission:{en:'Ask the station worker for directions.',th:'ถามเจ้าหน้าที่ถึงเส้นทาง',id:'Tanyakan arah kepada petugas.',vi:'Hỏi nhân viên nhà ga đường đi.'},answers:[['홍대입구역에 가려면 어떻게 가요?','Hongdae-ipgu-yeoge garyeomyeon eotteoke gayo?',1],['홍대입구역 주세요.','Hongdae-ipgu-yeok juseyo?',0],['저는 홍대예요.','Jeoneun Hongdae-yeyo.',0]]},{key:'restaurant',icon:'🍲',title:{en:'Order at a restaurant',th:'สั่งอาหารที่ร้าน',id:'Pesan di restoran',vi:'Gọi món tại nhà hàng'},intro:{en:'The server asks what you want to order.',th:'พนักงานถามว่าต้องการสั่งอะไร',id:'Pelayan menanyakan pesanan kamu.',vi:'Nhân viên hỏi bạn muốn gọi món gì.'},ko:'비빔밥 하나 주세요.',roman:'Bibimbap hana juseyo.',meaning:{en:'One bibimbap, please.',th:'ขอบิบิมบับหนึ่งที่ค่ะ/ครับ',id:'Satu bibimbap, tolong.',vi:'Cho tôi một phần bibimbap.'},mission:{en:'Order one bibimbap politely.',th:'สั่งบิบิมบับหนึ่งที่อย่างสุภาพ',id:'Pesan satu bibimbap dengan sopan.',vi:'Gọi một phần bibimbap lịch sự.'},answers:[['비빔밥 하나 주세요.','Bibimbap hana juseyo.',1],['비빔밥 있어요?','Bibimbap isseoyo?',0],['나는 비빔밥.','Naneun bibimbap.',0]]},{key:'restaurant',icon:'💳',title:{en:'Pay by card',th:'ชำระด้วยบัตร',id:'Bayar dengan kartu',vi:'Thanh toán bằng thẻ'},intro:{en:'You finished eating and want to pay by card.',th:'คุณทานเสร็จแล้วและต้องการจ่ายด้วยบัตร',id:'Kamu selesai makan dan ingin membayar dengan kartu.',vi:'Bạn đã ăn xong và muốn thanh toán bằng thẻ.'},ko:'카드로 계산할게요.',roman:'Kadeuro gyesanhalgeyo.',meaning:{en:'I will pay by card.',th:'ขอจ่ายด้วยบัตรค่ะ/ครับ',id:'Saya akan membayar dengan kartu.',vi:'Tôi sẽ thanh toán bằng thẻ.'},mission:{en:'Tell the server you will pay by card.',th:'บอกพนักงานว่าจะจ่ายด้วยบัตร',id:'Beri tahu pelayan bahwa kamu membayar dengan kartu.',vi:'Nói với nhân viên rằng bạn sẽ thanh toán bằng thẻ.'},answers:[['카드로 계산할게요.','Kadeuro gyesanhalgeyo.',1],['카드 좋아요.','Kadeu joayo.',0],['계산 어디예요?','Gyesan eodiyeyo?',0]]}];
let lang='en',i=0,xp=0,locked=false;const $=x=>document.getElementById(x);Object.entries(L).forEach(([k,v])=>{const b=document.createElement('button');b.className='lang';b.innerHTML=`<span class="flag">${v.flag}</span><strong>${v.name}</strong>`;b.onclick=()=>start(k);$('languageGrid').appendChild(b)});
function start(k){lang=k;i=0;xp=0;$('language').style.display='none';$('done').style.display='none';$('game').style.display='block';render()}
function render(){locked=false;const s=S[i],l=L[lang];$('bar').style.width=`${i/S.length*100}%`;$('xp').textContent=xp;$('scene').className='scene '+s.key;$('label').textContent=`MISSION ${i+1} / ${S.length}`;$('icon').textContent=s.icon;$('title').textContent=s.title[lang];$('intro').textContent=s.intro[lang];$('ko').textContent=s.ko;$('roman').textContent=s.roman;$('meaning').textContent=s.meaning[lang];$('missionTitle').textContent=l.mission;$('mission').textContent=s.mission[lang];$('feedback').textContent=l.pick;$('next').textContent=l.next;$('next').style.display='none';$('restart').textContent='↺ '+l.restart;$('change').textContent='🌍 '+l.change;$('answers').innerHTML='';s.answers.forEach(a=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${a[0]}</strong><br><small>${a[1]}</small>`;b.onclick=()=>choose(b,a[2]);$('answers').appendChild(b)})}
function choose(b,ok){if(locked)return;if(ok){locked=true;b.classList.add('ok');xp+=100;$('xp').textContent=xp;$('feedback').textContent='✅ '+L[lang].ok;$('next').style.display='block'}else{b.classList.add('no');$('feedback').textContent='💡 '+L[lang].no}}
$('next').onclick=()=>{if(i<S.length-1){i++;render()}else{finish()}};$('restart').onclick=()=>start(lang);$('change').onclick=()=>{$('game').style.display='none';$('language').style.display='block'};$('again').onclick=()=>start(lang);
function finish(){$('game').style.display='none';$('done').style.display='block';$('doneTitle').textContent=L[lang].done;$('doneText').textContent=L[lang].doneText;$('again').textContent=L[lang].again;$('phrases').innerHTML=S.map(s=>`<div class="phrase"><strong>${s.ko}</strong><small>${s.roman}</small></div>`).join('')}
</script>
</body>
</html>
